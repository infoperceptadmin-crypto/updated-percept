{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Domain | Percept Placements</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#f3f6f9;
margin:0;
color:#111827;
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:0;
left:0;
width:240px;
height:100vh;
background:#111827;
padding-top:25px;
color:white;
display:flex;
flex-direction:column;
}

.sidebar h4{
text-align:center;
font-weight:700;
margin-bottom:30px;
}

.sidebar a,
.sidebar .logout-btn{
display:flex;
align-items:center;
padding:13px 25px;
color:#cbd5f5;
text-decoration:none;
margin-bottom:8px;
border-radius:8px;
font-size:15px;
transition:0.25s;
background:transparent;
border:none;
width:100%;
}

.sidebar a i,
.sidebar .logout-btn i{
margin-right:12px;
}

.sidebar a:hover,
.sidebar a.active,
.sidebar .logout-btn:hover{
background:#2563eb;
color:white;
}

/* NAVBAR */

.top-navbar{
position:fixed;
top:0;
left:240px;
right:0;
height:70px;
background:white;
border-bottom:1px solid #e2e8f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 35px;
z-index:100;
}

.nav-left{
display:flex;
align-items:center;
}

.nav-brand{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.brand-logo{
height:36px;
}

.brand-text{
font-weight:800;
font-size:18px;
color:#111827;
}

.nav-center{
position:absolute;
left:50%;
transform:translateX(-50%);
font-weight:600;
font-size:20px;
color:#334155;
}

/* MAIN */

.main-content{
margin-left:240px;
padding:100px 40px 40px;
width:100%;
}

/* CARD */

.card-box{
max-width:600px;
margin:auto;
background:white;
border-radius:14px;
padding:35px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.card-header{
font-size:20px;
font-weight:600;
margin-bottom:25px;
color:#1e293b;
}

input.form-control,
select.form-select{
border-radius:8px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h4>Admin</h4>

<a href="{% url 'adminpanel:admin_dashboard' %}">
<i class="bi bi-speedometer2"></i>Dashboard
</a>

<a href="{% url 'adminpanel:verify_employers' %}">
<i class="bi bi-building"></i>Verify Employers
</a>

<a href="{% url 'adminpanel:verify_candidates' %}">
<i class="bi bi-people"></i>Verify Candidates
</a>

<a href="{% url 'adminpanel:manage_skills' %}" class="active">
<i class="bi bi-code-slash"></i>Manage Skills
</a>

<div class="mt-auto mb-4 px-3">

<form action="{% url 'logout' %}" method="post">
{% csrf_token %}
<button type="submit" class="logout-btn">
<i class="bi bi-box-arrow-right"></i>Logout
</button>
</form>

</div>

</div>

<!-- NAVBAR -->

<div class="top-navbar">

<div class="nav-left">

<a class="nav-brand" href="/">
<img src="{% static 'img/percept_logo.png' %}" class="brand-logo">
<span class="brand-text">Percept Placements</span>
</a>

</div>

<div class="nav-center">
Edit Domain
</div>

</div>

<!-- MAIN -->

<div class="main-content">

<div class="card-box">

<div class="card-header">
✏ Edit Domain
</div>

<form method="post" action="{% url 'adminpanel:domain_edit' domain_to_edit.id %}">
{% csrf_token %}

<div class="input-group mb-4">

<input type="text"
name="domain_name"
class="form-control"
placeholder="Enter domain"
value="{{ domain_to_edit.domain_name }}"
required>

<button class="btn btn-primary" type="submit">
Update Domain
</button>

</div>

</form>

<div class="mb-3">

<label class="form-label">Existing Domains</label>

<select class="form-select" onchange="if(this.value) window.location.href=this.value;">

<option value="">-- Select Domain to Edit --</option>

{% for d in domains %}

<option value="{% url 'adminpanel:domain_edit' d.id %}" {% if domain_to_edit.id == d.id %}selected{% endif %}>
{{ d.domain_name }}
</option>

{% empty %}

<option disabled>No domains added yet</option>

{% endfor %}

</select>

</div>

<div class="text-end mt-4">

<a href="{% url 'adminpanel:manage_skills' %}" class="btn btn-secondary">
⬅ Back to Skills
</a>

</div>

</div>

</div>

</body>
</html>
