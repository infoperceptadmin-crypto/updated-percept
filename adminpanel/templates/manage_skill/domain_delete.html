<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Domain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            border-radius: 1.5rem;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            font-weight: 700;
            font-size: 1.5rem;
            text-align: center;
            padding: 1rem 0;
        }

        .card-body p {
            font-size: 1.3rem;
            text-align: center;
            margin: 2rem 0;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            font-size: 1.1rem;
            border-radius: 0.6rem;
        }
    </style>
</head>
<body>

<div class="card shadow">
    <div class="card-header bg-danger text-white">
        Delete Domain
    </div>
    <div class="card-body">
        <p>Are you sure you want to delete the domain: <strong>{{ domain.domain_name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="btn-group">


                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
