<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Skill</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #ffffff; /* White background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #f8f9fa; /* Light gray card for contrast */
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        h2 {
            color: #e63946;
            margin-bottom: 25px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 30px;
        }

        strong {
            color: #e63946;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 1rem;
        }

        .btn-delete {
            background: linear-gradient(45deg, #e63946, #d90429);
            color: #fff;
        }

        .btn-delete:hover {
            background: linear-gradient(45deg, #d90429, #e63946);
            transform: scale(1.05);
        }

        .btn-cancel {
            background: #adb5bd;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #868e96;
            transform: scale(1.05);
        }

        @media(max-width: 500px) {
            .card {
                padding: 30px 20px;
            }

            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            .btn {
                padding: 8px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>❌ Delete Skill</h2>

    <p>Are you sure you want to delete the skill: <strong>{{ skill.skill_name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">Yes, Delete</button>
        <a href="{% url 'manage_skill_list' %}" class="btn btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>
