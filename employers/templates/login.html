<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CA Job Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #70d6ff, #4ea8de);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .login-card h2 {
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            color: #1e293b;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
        }

        .btn-login {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }

        .extra-links a {
            text-decoration: none;
            font-weight: 600;
            color: #0d6efd;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="uname" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="pwd" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-login">Login</button>
        </div>
    </form>


        <a href="{% url 'index' %}">Home</a>
    </div>

    {% for message in messages %}
        <div class="error-msg">{{ message }}</div>
    {% endfor %}
</div>

</body>
</html>
